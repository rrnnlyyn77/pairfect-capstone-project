{% extends 'base.html' %}
{% block content %}

<div class="combo-header">
    <a href="/options" class="back-link">&lt; Go To Previous</a>
    <h2>DISCOVER PROPER INGREDIENT COMBOS</h2>
    <p class="combo-sub">Are you using the correct active ingredient mix?</p>
</div>

<div class="combo-grid">

    {% for item in ingredients %}
    <div class="combo-card" onclick="openIngredient('{{ item.name }}', '{{ item.img }}')">
        <img src="/static/images/ingredients/{{ item.img }}" class="combo-img">
        <div class="combo-name">{{ item.name }}</div>
        <div class="combo-icon">ℹ</div>
    </div>
    {% endfor %}

</div>

<!-- MODAL OVERLAY -->
<div id="ingredientModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">

        <span class="modal-close" onclick="closeModal()">✕</span>
        <img id="modalImg" class="modal-img" src="" alt="">

        <h3 id="modalName" class="modal-title">Ingredient Name</h3>

        <div class="modal-section mix-with">
            <h4>MIX WITH:</h4>
            <ul id="mixList"></ul>
        </div>

        <div class="modal-section avoid-with">
            <h4>DO NOT MIX WITH:</h4>
            <ul id="avoidList"></ul>
        </div>

    </div>
</div>

{% endblock %}
